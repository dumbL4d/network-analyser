# This simulates a small warehouse network topology for local development in the
# absence of real hardware. The 12 `sim-*` containers are ICMP-pingable Alpine
# stubs arranged in a tree with two redundant links (see infra/devices.seed.json
# for the topology). The real backend service will ping these by their static
# IPs on the warehouse-net bridge network.

networks:
  warehouse-net:
    driver: bridge
    ipam:
      config:
        # Gateway moved off .1 so the firewall device can own 10.99.0.1.
        - subnet: "10.99.0.0/24"
          gateway: "10.99.0.254"
  # Backend <-> chaos agent only (docs/chaos.md). "internal" means no route to
  # the host or the internet, and the simulated devices are not on it.
  control-net:
    driver: bridge
    internal: true

# What every simulated device has in common; each sim-* service below adds its
# address. The label marks the containers the chaos agent may act on. iproute2
# (in the image) and NET_ADMIN are what `tc netem` needs to add delay and loss
# on a device's own network interface. Both are unused unless the "chaos"
# profile is running.
x-sim: &sim
  build:
    context: ./sim
  # One image for all twelve, instead of twelve identical ones.
  image: netanalyser-sim:local
  command: sleep infinity
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  labels:
    netanalyser.sim: "true"

services:
  sim-fw-01:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.1

  sim-sw-edge:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.2

  # Second edge switch: with the extra links sw-server <-> sw-edge-2 and
  # sw-ot <-> sw-edge-2 (infra/devices.seed.json) it gives both tier switches a
  # way to the firewall that does not pass through sim-sw-edge.
  sim-sw-edge-2:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.5

  sim-sw-server:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.3

  sim-sw-ot:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.4

  sim-srv-prod-1:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.10

  sim-srv-prod-2:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.11

  sim-plc-conveyor-1:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.20

  sim-hmi-panel-1:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.21

  sim-ap-aisle-1:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.30

  sim-ap-aisle-2:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.31

  sim-scanner-1:
    <<: *sim
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.40

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # icmplib pings devices over raw ICMP sockets, so CAP_NET_RAW is required
    # or the backend cannot reach the sim-* devices.
    cap_add:
      - NET_RAW
    ports:
      - "8000:8000"
    # SQLite persistence: named volume survives container recreation (down/up,
    # rebuilds). The image pre-creates /app/data so a volume-less run also works.
    volumes:
      - backend-data:/app/data
      # Read-only reference topology. The backend seeds the 12 sim-* devices
      # and their extra links from here (seed.py resolves /app/infra/devices.seed.json
      # as the repo-layout path); swap in real device IPs here per deployment.
      - ../infra/devices.seed.json:/app/infra/devices.seed.json:ro
    networks:
      warehouse-net:
        # Not DHCP. On the very first parallel start Docker's bridge IPAM handed
        # the previously-DHCP'd backend 10.99.0.1 -- statically reserved for
        # sim-fw-01 -- so sim-fw-01 failed to start with "Address already in
        # use". Nothing pings the backend (it only makes outbound ICMP), so
        # any free address works; pinning one (.99, clear
        # of the sims' statics >= .40) makes startup deterministic.
        ipv4_address: 10.99.0.99
      # Where the chaos agent is, when the "chaos" profile is running.
      control-net: {}
    environment:
      # REQUIRED and never the insecure dev default from config.py. The `:?`
      # interpolation fails startup if unset, so a missing infra/.env cannot
      # silently ship with the development secret. The backend itself refuses
      # the placeholder from .env.example and anything under 32 characters
      # (unless DEMO_MODE is true). Generate with:
      #   openssl rand -hex 32
      JWT_SECRET_KEY: '${JWT_SECRET_KEY:?set JWT_SECRET_KEY in infra/.env (see infra/.env.example)}'
      # JSON-array form is what pydantic-settings expects for the list[str]
      # CORS_ORIGINS field. Allows the
      # Vite dev origin (:5173) and the containerized nginx origin (:8080).
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
      # First start only: the passwords of the two default accounts. One that
      # is left empty is generated and written to the backend log, once. Both
      # accounts must change theirs at the first login (docs/security.md).
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      VIEWER_INITIAL_PASSWORD: ${VIEWER_INITIAL_PASSWORD:-}
      # INSECURE, demos only: "true" seeds admin/admin123 and viewer/viewer123
      # and switches the forced password change off. Off unless asked for.
      DEMO_MODE: ${DEMO_MODE:-false}
      # How long a login lasts, in minutes.
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      # How long one ping waits for its reply, in seconds. A device that does
      # not answer costs this once per ping of a cycle (see "Probe statistics
      # and classification" in ../docs/algorithms.md).
      PING_TIMEOUT_SECONDS: ${PING_TIMEOUT_SECONDS:-2.0}
      # Data retention (see "Data persistence and retention" in
      # ../docs/architecture.md).
      # The defaults are the same as in backend/app/core/config.py; override
      # them in infra/.env.
      RAW_RETENTION_HOURS: ${RAW_RETENTION_HOURS:-24}
      ROLLUP_RETENTION_DAYS: ${ROLLUP_RETENTION_DAYS:-30}
      TRANSITION_RETENTION_DAYS: ${TRANSITION_RETENTION_DAYS:-30}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
      # Fault injection (docs/chaos.md). The agent only exists under the
      # "chaos" profile. Without it, or without a token, the chaos endpoints
      # answer 503 and nothing else is affected.
      CHAOS_AGENT_URL: ${CHAOS_AGENT_URL:-http://chaos-agent:8081}
      CHAOS_AGENT_TOKEN: ${CHAOS_AGENT_TOKEN:-}
    restart: unless-stopped
    # No depends_on on the sim-* devices on purpose: Compose would not model
    # them usefully (they are not a formal dependency), and a monitoring tool
    # correctly reports devices as down until they come online -- the same
    # behavior a real deployment expects when hardware powers up independently.

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Compile-time Vite var (baked into the bundle at build time): the
        # address the END USER'S BROWSER uses to reach the backend. The browser
        # -- not this container -- makes the API calls, so this defaults to the
        # host-local address for local testing and should be set to the server's
        # LAN-reachable host/port for a real deployment.
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    restart: unless-stopped
    # Deliberately NO networks entry: this container only serves static files
    # over the published :8080 port. It never talks to the backend or the
    # sim-* devices itself (the browser does, out-of-band), so attaching it to
    # warehouse-net would add nothing. No volume needed either: the bundle is
    # fully baked into the image.

  # Fault injection executor (docs/chaos.md). OFF by default: it only starts
  # with `--profile chaos`. It mounts the Docker socket, which is as good as
  # root on the host, so it is fenced in:
  #   - no port is published to the host;
  #   - it is only on control-net, an internal network shared with the backend;
  #   - every request needs the shared secret CHAOS_AGENT_TOKEN, and the agent
  #     refuses to start without one;
  #   - it only acts on containers labelled netanalyser.sim=true, and only
  #     on those of this Compose project;
  #   - read-only filesystem, no capabilities, no privilege escalation.
  chaos-agent:
    profiles: ["chaos"]
    build:
      context: ./chaos-agent
    environment:
      CHAOS_AGENT_TOKEN: ${CHAOS_AGENT_TOKEN:-}
      # Only this Compose project's sim containers are the agent's business.
      CHAOS_AGENT_PROJECT: ${COMPOSE_PROJECT_NAME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control-net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  backend-data:
