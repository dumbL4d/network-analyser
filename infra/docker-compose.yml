# This simulates a small warehouse network topology for local development in the
# absence of real hardware. The 11 `sim-*` containers are ICMP-pingable Alpine
# stubs arranged in a tree (see infra/devices.seed.json for topology). The real
# backend service will ping these by their static IPs on the warehouse-net bridge
# network.

networks:
  warehouse-net:
    driver: bridge
    ipam:
      config:
        # Gateway moved off .1 so the firewall device can own 10.99.0.1.
        - subnet: "10.99.0.0/24"
          gateway: "10.99.0.254"

services:
  sim-fw-01:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.1

  sim-sw-edge:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.2

  sim-sw-server:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.3

  sim-sw-ot:
