# This simulates a small warehouse network topology for local development in the
# absence of real hardware. The 11 `sim-*` containers are ICMP-pingable Alpine
# stubs arranged in a tree (see infra/devices.seed.json for topology). The real
# backend service will ping these by their static IPs on the warehouse-net bridge
# network.

networks:
  warehouse-net:
    driver: bridge
    ipam:
      config:
        # Gateway moved off .1 so the firewall device can own 10.99.0.1.
        - subnet: "10.99.0.0/24"
          gateway: "10.99.0.254"

services:
  sim-fw-01:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.1

  sim-sw-edge:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.2

  sim-sw-server:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.3

  sim-sw-ot:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.4

  sim-srv-prod-1:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.10

  sim-srv-prod-2:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.11

  sim-plc-conveyor-1:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.20

  sim-hmi-panel-1:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.21

  sim-ap-aisle-1:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.30

  sim-ap-aisle-2:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.31

  sim-scanner-1:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
    networks:
      warehouse-net:
        ipv4_address: 10.99.0.40

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # icmplib pings devices over raw ICMP sockets (Ticket 1.2), so CAP_NET_RAW
    # is required or the backend cannot reach the sim-* devices. Confirmed in
    # Tickets 6.1/6.2 standalone verification.
    cap_add:
      - NET_RAW
    ports:
      - "8000:8000"
    # SQLite persistence: named volume survives container recreation (down/up,
    # rebuilds). The image pre-creates /app/data so a volume-less run also works.
    volumes:
      - backend-data:/app/data
      # Read-only reference topology. On a fresh DB the backend seeds the 11
      # sim-* devices from here (seed.py resolves /app/infra/devices.seed.json
      # as the repo-layout path); swap in real device IPs here per deployment.
      - ../infra/devices.seed.json:/app/infra/devices.seed.json:ro
    networks:
      warehouse-net:
        # Not DHCP. On the very first parallel start Docker's bridge IPAM handed
        # the previously-DHCP'd backend 10.99.0.1 -- statically reserved for
        # sim-fw-01 -- so sim-fw-01 failed to start with "Address already in
        # use". Nothing pings the backend (it only makes outbound ICMP, per
        # Tickets 1.2/6.1), so any free address works; pinning one (.99, clear
        # of the sims' statics >= .40) makes startup deterministic.
        ipv4_address: 10.99.0.99
    environment:
      # REQUIRED and never the insecure dev default from config.py. The `:?`
      # interpolation fails startup if unset, so a missing infra/.env cannot
      # silently ship with the development secret. Generate with:
      #   openssl rand -hex 32
      JWT_SECRET_KEY: '${JWT_SECRET_KEY:?set JWT_SECRET_KEY in infra/.env (see infra/.env.example)}'
      # JSON-array form is what pydantic-settings expects for the list[str]
      # CORS_ORIGINS field (verified concretely in Ticket 6.2). Allows the
      # Vite dev origin (:5173) and the containerized nginx origin (:8080).
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
      # Data retention (see "Data persistence and retention" in ../README.md).
      # The defaults are the same as in backend/app/core/config.py; override
      # them in infra/.env.
      RAW_RETENTION_HOURS: ${RAW_RETENTION_HOURS:-24}
      ROLLUP_RETENTION_DAYS: ${ROLLUP_RETENTION_DAYS:-30}
      TRANSITION_RETENTION_DAYS: ${TRANSITION_RETENTION_DAYS:-30}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
    restart: unless-stopped
    # No depends_on on the sim-* devices on purpose: Compose would not model
    # them usefully (they are not a formal dependency), and a monitoring tool
    # correctly reports devices as down until they come online -- the same
    # behavior a real deployment expects when hardware powers up independently.

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Compile-time Vite var (baked into the bundle at build time): the
        # address the END USER'S BROWSER uses to reach the backend. The browser
        # -- not this container -- makes the API calls, so this defaults to the
        # host-local address for local testing and should be set to the server's
        # LAN-reachable host/port for a real deployment.
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    restart: unless-stopped
    # Deliberately NO networks entry: this container only serves static files
    # over the published :8080 port. It never talks to the backend or the
    # sim-* devices itself (the browser does, out-of-band), so attaching it to
    # warehouse-net would add nothing. No volume needed either: the bundle is
    # fully baked into the image.

volumes:
  backend-data:
