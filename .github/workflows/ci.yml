name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: Require 80% coverage on app/services
        run: python -m coverage report --include="app/services/*" --fail-under=80

  frontend:
    name: Frontend typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major version as frontend/Dockerfile.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        # tsconfig.json only lists project references, so plain
        # `tsc --noEmit` would check nothing; build mode follows them.
        run: npx tsc -b --noEmit
      - name: Lint (when a lint script exists)
        run: npm run lint --if-present
      - name: Build
        run: npm run build
