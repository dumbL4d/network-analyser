server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers, sent with every response ("always": errors included).
    # Kept at server level on purpose: a location with an add_header of its
    # own would no longer inherit these.
    #
    # Content-Security-Policy: what the page may load and where it may connect.
    #   default-src 'self'      scripts, styles, images, fonts: this server only.
    #   script-src 'self'       no inline script, so markup that was injected
    #                           into the page cannot run code.
    #   style-src ... 'unsafe-inline'
    #                           needed by the UI library: its Select component
    #                           (Radix) inserts a <style> element at runtime.
    #                           Without it every dropdown logs a violation.
    #   connect-src             fetch and the status stream: this server and the
    #                           API. __API_ORIGIN__ is replaced by the origin of
    #                           VITE_API_BASE_URL when the image is built
    #                           (see Dockerfile).
    #   frame-ancestors 'none'  the app cannot be put in a frame (clickjacking).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Use the declared Content-Type; never guess one from the content.
    add_header X-Content-Type-Options "nosniff" always;
    # What frame-ancestors says, for browsers that predate it.
    add_header X-Frame-Options "DENY" always;
    # Never tell another site which page a link was followed from.
    add_header Referrer-Policy "no-referrer" always;

    # SPA fallback: React Router owns client-side routing, so any path that is
    # not a real static file must serve index.html. Without this, refreshing or
    # typing a deep link such as /devices/sw-ot or /admin directly would return
    # nginx's 404 before React Router ever runs.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
