[pytest]
# Collect tests/ only. scripts/manual_ping_test.py is a manual utility whose
# name would otherwise match pytest's default "*_test.py" pattern.
testpaths = tests
python_files = test_*.py
# Plain "async def test_..." functions run on an asyncio event loop.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Always list xfailed/skipped tests with their reasons.
addopts = -ra
# Known deprecation warnings raised inside third-party packages, silenced so a
# new warning from our own code stands out. Drop a line when its package is
# upgraded.
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:jose.jwt
    ignore:'crypt' is deprecated:DeprecationWarning:passlib.utils
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient
