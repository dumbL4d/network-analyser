# Alembic configuration for the command line (run `alembic ...` from backend/).
#
# The app does not read this file. At startup it runs the same migrations
# through app/db/session.py (`init_db`), the equivalent of `alembic upgrade head`.

[alembic]
# Migration scripts live inside the app package, so the Docker image (which
# copies app/) ships them.
script_location = %(here)s/app/db/migrations

# Makes `import app` work when alembic is started from backend/.
prepend_sys_path = .
path_separator = os

# No database URL here on purpose: env.py uses the app's own engine, i.e. the
# database named by DATABASE_PATH (environment variable or backend/.env).

# Logging for the command line only (consumed by env.py).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
